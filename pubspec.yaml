name: mireon
description: "Mireon - Private Media, galeria multimedia local y privada."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  photo_manager: ^3.7.0
  video_player: ^2.9.2
  screen_brightness: ^2.1.11
  volume_controller: ^3.6.0
  audio_session: ^0.2.4
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  open_filex: ^4.7.0
  crypto: ^3.0.6
  cryptography: ^2.9.0
  flutter_secure_storage: 10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
